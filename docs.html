<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Documents - My Site</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .main-content { max-width: 900px; }
        
        /* ドキュメントカードのスタイル */
        .docs-grid {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 20px;
        }
        .doc-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            border: 1px solid #eee;
            transition: 0.3s;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .doc-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            border-color: var(--primary-color);
        }
        .doc-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }
        .doc-title {
            font-size: 1.4rem;
            font-weight: bold;
            color: var(--primary-color);
            text-decoration: none;
            margin: 0;
            cursor: default;
        }
        .doc-title:hover { text-decoration: none; }
        .doc-date {
            font-size: 0.9rem;
            color: var(--accent-gray);
            background: #f0f2f5;
            padding: 4px 10px;
            border-radius: 20px;
        }
        .doc-description {
            color: var(--text-color);
            line-height: 1.6;
            font-size: 1rem;
        }
        .doc-footer {
            margin-top: 5px;
        }
        .pdf-link {
            color: #d32f2f; /* PDFっぽい赤色 */
            font-weight: bold;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .pdf-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
   
    <div class="container">
        <aside class="sidebar">
            <div class="profile"><h2>Kenta Inoue</h2><p>@sugakutoprecure</p></div>
            <nav class="nav-menu">
                <ul>
                    <li><a href="index.html"><i class="fa-solid fa-house"></i> ホーム</a></li>
                    <li><a href="diary.html"><i class="fa-solid fa-book"></i> 日記</a></li>
                    <li><a href="docs.html" class="active"><i class="fa-solid fa-file-lines"></i> 公開文書</a></li>
                    <li><a href="literature.html"><i class="fa-solid fa-bookmark"></i> 文献</a></li>
                </ul>
            </nav>
        </aside>

        <main class="main-content">
            <h1>公開文書</h1>
            <p>勉強したことをまとめたPDF一覧です。</p>
            
            <div id="docs-list" class="docs-grid">
                </div>
        </main>
    </div>

    <script>
        /**
         * 【ここを更新するだけ！】
         * 新しいドキュメントを追加する場合は、以下のオブジェクトを配列に追加してください。
         */
        const myDocuments = [
            {
                title: "交叉理論についての覚書",
                date: "2026-05-2",
                url: "https://drive.google.com/file/d/14mtbIR59u2Ahb_Dx_HwchlrQArmYLrdk/view?usp=sharing",
                description: "私が勉強している交叉理論について、代数的サイクルの定義からGrothendieck-Rieman-Rochの定理の証明までまとめたPDF（に育てるつもり）です。"
            } //2つ目以降の最後には","をつける！            
        ];

        function renderDocs() {
            const container = document.getElementById('docs-list');
            // 日付の新しい順にソート
            const sortedDocs = myDocuments.sort((a, b) => new Date(b.date) - new Date(a.date));

            let html = '';
            sortedDocs.forEach(doc => {
                const displayDate = doc.date.replace(/-/g, '/');
                html += `
                    <div class="doc-card">
                        <div class="doc-header">
                            <h2 class="doc-title">${doc.title}</h2>
                            <span class="doc-date">${displayDate}</span>
                        </div>
                        <p class="doc-description">${doc.description}</p>
                        <div class="doc-footer">
                            <a href="${doc.url}" target="_blank" class="pdf-link">
                                <i class="fa-solid fa-file-pdf"></i> PDFを開く
                            </a>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        // 初期表示
        window.addEventListener('DOMContentLoaded', renderDocs);
        　　　　
    </script>
</body>
</html>
