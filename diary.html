<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diary - My Site</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>window.MathJax = { tex: { inlineMath: [['$', '$']] } };</script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <style>
        /* アーカイブページのスタイル */
        .archive-grid {
            display: grid;
            gap: 20px;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            margin-top: 20px;
        }
        .year-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            border: 1px solid #eee;
        }
        .year-card h2 {
            font-size: 1.4rem;
            color: var(--primary-color);
            border-bottom: 2px solid #f0f2f5;
            padding-bottom: 10px;
            margin-bottom: 10px;
        }
        .month-label {
            display: block;
            font-weight: bold;
            margin-top: 15px;
            color: var(--accent-gray);
            font-size: 0.9rem;
        }
        .diary-link {
            display: block;
            padding: 8px 10px;
            color: var(--text-color);
            text-decoration: none;
            border-radius: 5px;
            transition: 0.2s;
        }
        .diary-link:hover {
            background-color: #e7f3ff;
            color: var(--primary-color);
        }
        .back-button {
            display: inline-block;
            margin-bottom: 20px;
            cursor: pointer;
            color: var(--accent-gray);
            font-weight: bold;
        }
        .back-button:hover { color: var(--primary-color); }
    </style>
</head>
<body>
    <div class="container">
        <aside class="sidebar">
            <div class="profile"><h2>Your Name</h2><p>@username</p></div>
            <nav class="nav-menu">
                <ul>
                    <li><a href="index.html"><i class="fa-solid fa-house"></i> ホーム</a></li>
                    <li><a href="diary.html" class="active"><i class="fa-solid fa-book"></i> 日記</a></li>
                    <li><a href="docs.html"><i class="fa-solid fa-file-lines"></i> 公開文書</a></li>
                </ul>
            </nav>
        </aside>

        <main class="main-content">
            <section id="archive-view">
                <h1>Diary Archives</h1>
                <p>過去の日記一覧です。読みたい日付を選択してください。</p>
                <div id="archive-list" class="archive-grid"></div>
            </section>

            <section id="post-view" style="display:none;">
                <div class="back-button" onclick="location.href='diary.html'">
                    <i class="fa-solid fa-chevron-left"></i> 一覧に戻る
                </div>
                <header>
                    <h1 id="display-title"></h1>
                </header>
                <article id="diary-container" class="card"></article>
            </section>
        </main>
    </div>

    <script>
        /**
         * 【ここを更新するだけ！】
         * 新しい日記を書いたら、ここに "YYYY-MM-DD" を追加してください
         */
        const diaryPosts = [
            "2026-05-02",
            "2026-05-01",
            "2025-12-24",
            "2025-11-10"
        ];

        function init() {
            const params = new URLSearchParams(window.location.search);
            const post = params.get('post');

            if (post) {
                showPost(post);
            } else {
                showArchive();
            }
        }

        // アーカイブ一覧を表示
        function showArchive() {
            const listContainer = document.getElementById('archive-list');
            const tree = {};

            // データを年・月で整理
            diaryPosts.forEach(id => {
                const [y, m] = id.split('-');
                if (!tree[y]) tree[y] = {};
                if (!tree[y][m]) tree[y][m] = [];
                tree[y][m].push(id);
            });

            let html = '';
            // 年を降順でループ
            Object.keys(tree).sort((a, b) => b - a).forEach(year => {
                html += `<div class="year-card"><h2>${year}年</h2>`;
                
                // 月を降順でループ
                Object.keys(tree[year]).sort((a, b) => b - a).forEach(month => {
                    html += `<span class="month-label">${parseInt(month)}月</span>`;
                    tree[year][month].forEach(id => {
                        const day = id.split('-')[2];
                        html += `<a href="?post=${id}" class="diary-link">${parseInt(day)}日の日記</a>`;
                    });
                });
                html += `</div>`;
            });
            listContainer.innerHTML = html;
        }

        // 記事本文を表示
        async function showPost(id) {
            document.getElementById('archive-view').style.display = 'none';
            document.getElementById('post-view').style.display = 'block';
            
            const container = document.getElementById('diary-container');
            const titleDisplay = document.getElementById('display-title');
            
            try {
                const res = await fetch(`posts/${id}.md`);
                if (!res.ok) throw new Error();
                const md = await res.text();
                
                titleDisplay.innerText = id.replace(/-/g, '/');
                container.innerHTML = marked.parse(md);

                // MathJax レンダリング
                if (window.MathJax) MathJax.typesetPromise([container]);
            } catch (e) {
                container.innerHTML = "記事の読み込みに失敗しました。";
            }
        }

        init();
    </script>
</body>
</html>
