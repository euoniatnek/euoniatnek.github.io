<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diary - My Site</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>window.MathJax = { tex: { inlineMath: [['$', '$']] } };</script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <style>
        /* 階層ナビゲーション用のスタイル */
        .archive-container { display: grid; gap: 1.5rem; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); margin-top: 20px; }
        .archive-card {
            background: white; padding: 2rem; border-radius: 12px; text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05); border: 1px solid #eee;
            cursor: pointer; transition: 0.3s; text-decoration: none; color: inherit;
        }
        .archive-card:hover { transform: translateY(-5px); border-color: var(--primary-color); box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .archive-card h2 { margin: 0; color: var(--primary-color); }
        
        .list-group { background: white; border-radius: 12px; overflow: hidden; border: 1px solid #eee; }
        .list-item { 
            display: block; padding: 15px 20px; text-decoration: none; color: var(--text-color);
            border-bottom: 1px solid #eee; transition: 0.2s;
        }
        .list-item:last-child { border-bottom: none; }
        .list-item:hover { background: #f0f7ff; color: var(--primary-color); }

        .breadcrumb { margin-bottom: 20px; color: var(--accent-gray); font-weight: bold; cursor: pointer; }
        .breadcrumb span:hover { color: var(--primary-color); text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <aside class="sidebar">
            <nav class="nav-menu">
                <ul>
                    <li><a href="index.html"><i class="fa-solid fa-house"></i> ホーム</a></li>
                    <li><a href="diary.html" class="active"><i class="fa-solid fa-book"></i> 日記</a></li>
                    <li><a href="docs.html"><i class="fa-solid fa-file-lines"></i> 公開文書</a></li>
                </ul>
            </nav>
        </aside>

        <main class="main-content">
            <nav class="breadcrumb" id="breadcrumb" style="display:none;"></nav>

            <div id="diary-view">
                </div>
        </main>
    </div>

    <script>
        /**
         * 日記の管理リスト（ここに日付を追加するだけ）
         */
        const diaryPosts = [
            "2026-05-02", "2026-05-01", "2026-04-15",
            "2025-12-24", "2025-11-10", "2024-08-05"
        ];

        const view = document.getElementById('diary-view');
        const breadcrumb = document.getElementById('breadcrumb');

        function init() {
            const params = new URLSearchParams(window.location.search);
            const year = params.get('year');
            const month = params.get('month');
            const post = params.get('post');

            if (post) {
                renderPost(post);
            } else if (year && month) {
                renderDayList(year, month);
            } else if (year) {
                renderMonthList(year);
            } else {
                renderYearList();
            }
        }

        // 1. 年一覧を表示
        function renderYearList() {
            breadcrumb.style.display = 'none';
            const years = [...new Set(diaryPosts.map(id => id.split('-')[0]))].sort((a,b) => b-a);
            let html = '<h1>Archives</h1><div class="archive-container">';
            years.forEach(y => {
                html += `<a href="?year=${y}" class="archive-card"><h2>${y}年</h2></a>`;
            });
            view.innerHTML = html + '</div>';
        }

        // 2. 月一覧を表示
        function renderMonthList(year) {
            breadcrumb.style.display = 'block';
            breadcrumb.innerHTML = `<span onclick="location.href='diary.html'">Archives</span> > ${year}年`;
            
            const months = [...new Set(diaryPosts.filter(id => id.startsWith(year)).map(id => id.split('-')[1]))].sort((a,b) => b-a);
            let html = `<h1>${year}年の月を選択</h1><div class="archive-container">`;
            months.forEach(m => {
                html += `<a href="?year=${year}&month=${m}" class="archive-card"><h2>${parseInt(m)}月</h2></a>`;
            });
            view.innerHTML = html + '</div>';
        }

        // 3. 日（記事）一覧を表示
        function renderDayList(year, month) {
            breadcrumb.style.display = 'block';
            breadcrumb.innerHTML = `<span onclick="location.href='diary.html'">Archives</span> > <span onclick="location.href='?year=${year}'">${year}年</span> > ${parseInt(month)}月`;
            
            const posts = diaryPosts.filter(id => id.startsWith(`${year}-${month}`)).sort((a,b) => b-a);
            let html = `<h1>${parseInt(month)}月の日記</h1><div class="list-group">`;
            posts.forEach(id => {
                const day = id.split('-')[2];
                html += `<a href="?post=${id}" class="list-item">${parseInt(day)}日の日記</a>`;
            });
            view.innerHTML = html + '</div>';
        }

        // 4. 記事本文を表示
        async function renderPost(id) {
            const [y, m, d] = id.split('-');
            breadcrumb.style.display = 'block';
            breadcrumb.innerHTML = `<span onclick="location.href='diary.html'">Archives</span> > <span onclick="location.href='?year=${y}'">${y}年</span> > <span onclick="location.href='?year=${y}&month=${m}'">${parseInt(m)}月</span>`;

            view.innerHTML = `<h1 id="post-title">${y}/${m}/${d}</h1><article id="diary-container" class="card">読み込み中...</article>`;
            
            try {
                const res = await fetch(`posts/${id}.md`);
                const md = await res.text();
                const container = document.getElementById('diary-container');
                container.innerHTML = marked.parse(md);
                if (window.MathJax) MathJax.typesetPromise([container]);
            } catch (e) {
                document.getElementById('diary-container').innerHTML = "エラー：記事が見つかりません。";
            }
        }

        init();
    </script>
</body>
</html>
