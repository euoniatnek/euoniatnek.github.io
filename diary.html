<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diary - My Site</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <script>
      window.MathJax = { tex: { inlineMath: [['$', '$']] } };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body>
    <div class="container">
        <aside class="sidebar">
            <div class="profile"><h2>Your Name</h2><p>@username</p></div>
            <nav class="nav-menu">
                <ul>
                    <li><a href="index.html"><i class="fa-solid fa-house"></i> ホーム</a></li>
                    <li><a href="diary.html" class="active"><i class="fa-solid fa-book"></i> 日記</a></li>
                    <li><a href="docs.html"><i class="fa-solid fa-file-lines"></i> 公開文書</a></li>
                </ul>
            </nav>
        </aside>

        <main class="main-content">
            <h1>Diary</h1>
            <div id="diary-container" class="card">読み込み中...</div>
            
            <hr>
            <p><small>※過去の日記はファイル名を指定して閲覧してください。</small></p>
        </main>
    </div>

    <script>
        // URLのパラメータからファイル名を取得（例: diary.html?post=2026-05-02）
        const urlParams = new URLSearchParams(window.location.search);
        let postName = urlParams.get('post') || '2026-05-02'; // 指定がなければ最新のを入れる

        // Markdownファイルを読み込んで表示
        fetch(`posts/${postName}.md`)
            .then(response => {
                if (!response.ok) throw new Error('ファイルが見つかりません');
                return response.text();
            })
            .then(text => {
                document.getElementById('diary-container').innerHTML = marked.parse(text);
                MathJax.typeset(); // 数式を再レンダリング
            })
            .catch(err => {
                document.getElementById('diary-container').innerHTML = "記事の読み込みに失敗しました。";
            });
    </script>
</body>
</html>
