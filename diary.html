<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diary - My Site</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
      window.MathJax = { tex: { inlineMath: [['$', '$']] } };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body>
    <div class="container">
        <aside class="sidebar">
            <div class="profile"><h2>Your Name</h2><p>@username</p></div>
            <nav class="nav-menu">
                <ul>
                    <li><a href="index.html"><i class="fa-solid fa-house"></i> ホーム</a></li>
                    <li><a href="diary.html" class="active"><i class="fa-solid fa-book"></i> 日記</a></li>
                    <li><a href="docs.html"><i class="fa-solid fa-file-lines"></i> 公開文書</a></li>
                </ul>
            </nav>
        </aside>

        <main class="main-content">
            <h1>Diary</h1>
            <div id="diary-container" class="card">読み込み中...</div>
            
            <hr>
            <p><small>※過去の日記はファイル名を指定して閲覧してください。</small></p>
        </main>
    </div>

    <script>
    async function loadDiary() {
        const diaryContainer = document.getElementById('diary-container');
        
        // 1. URLパラメータからファイル名を取得
        const urlParams = new URLSearchParams(window.location.search);
        let postName = urlParams.get('post') || '2026-05-02'; // デフォルトファイル名

        try {
            // 2. ファイルを取得
            const response = await fetch(`posts/${postName}.md`);
            
            if (!response.ok) {
                throw new Error('File not found');
            }

            const text = await response.text();

            // 3. MarkdownをHTMLに変換して代入
            diaryContainer.innerHTML = marked.parse(text);

            // 4. MathJaxが読み込まれているか確認してから数式をレンダリング
            if (window.MathJax && window.MathJax.typesetPromise) {
                window.MathJax.typesetPromise([diaryContainer]).catch((err) => console.log(err));
            }

        } catch (err) {
            console.error(err);
            diaryContainer.innerHTML = `
                <div style="color: #d93025;">
                    <i class="fa-solid fa-circle-exclamation"></i> 
                    記事（${postName}.md）が見つかりませんでした。<br>
                    <small>ファイル名が正しいか、postsフォルダ内にあるか確認してください。</small>
                </div>`;
        }
    }

    // ページ読み込み完了時に実行
    window.addEventListener('DOMContentLoaded', loadDiary);
</script>
</body>
</html>
