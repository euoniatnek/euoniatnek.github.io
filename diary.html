<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diary - My Site</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>window.MathJax = { tex: { inlineMath: [['$', '$']] } };</script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <style>
        /* 階層ナビゲーション用のスタイル */
        .archive-container { display: grid; gap: 1.5rem; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); margin-top: 20px; }
        .archive-card {
            background: white; padding: 2rem; border-radius: 12px; text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05); border: 1px solid #eee;
            cursor: pointer; transition: 0.3s; text-decoration: none; color: inherit;
        }
        .archive-card:hover { transform: translateY(-5px); border-color: var(--primary-color); box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .archive-card h2 { margin: 0; color: var(--primary-color); }

        /* 月別表示（縦並び）のスタイル */
        .monthly-posts-container { display: flex; flex-direction: column; gap: 40px; margin-top: 30px; }
        .diary-post { border-left: 4px solid var(--primary-color); padding-left: 20px; }
        .diary-post-date { font-size: 1.2rem; font-weight: bold; color: var(--accent-gray); margin-bottom: 10px; }
        
        .breadcrumb { margin-bottom: 20px; color: var(--accent-gray); font-weight: bold; cursor: pointer; }
        .breadcrumb span:hover { color: var(--primary-color); text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <aside class="sidebar">
            <nav class="nav-menu">
                <ul>
                    <li><a href="index.html"><i class="fa-solid fa-house"></i> ホーム</a></li>
                    <li><a href="diary.html" class="active"><i class="fa-solid fa-book"></i> 日記</a></li>
                    <li><a href="docs.html"><i class="fa-solid fa-file-lines"></i> 公開文書</a></li>
                </ul>
            </nav>
        </aside>

        <main class="main-content">
            <nav class="breadcrumb" id="breadcrumb" style="display:none;"></nav>
            <div id="diary-view"></div>
        </main>
    </div>

    <script>
        /**
         * 日記リスト
         */
        const diaryPosts = [
            "2026-05-02", "2026-05-01", "2026-04-15",
            "2025-12-24", "2025-11-10", "2024-08-05"
        ];

        const view = document.getElementById('diary-view');
        const breadcrumb = document.getElementById('breadcrumb');

        function init() {
            const params = new URLSearchParams(window.location.search);
            const year = params.get('year');
            const month = params.get('month');

            if (year && month) {
                renderMonthlyStream(year, month);
            } else if (year) {
                renderMonthList(year);
            } else {
                renderYearList();
            }
        }

        // 1. 年一覧
        function renderYearList() {
            breadcrumb.style.display = 'none';
            const years = [...new Set(diaryPosts.map(id => id.split('-')[0]))].sort((a,b) => b-a);
            let html = '<h1>Diary Archives</h1><div class="archive-container">';
            years.forEach(y => {
                html += `<a href="?year=${y}" class="archive-card"><h2>${y}年</h2></a>`;
            });
            view.innerHTML = html + '</div>';
        }

        // 2. 月一覧
        function renderMonthList(year) {
            breadcrumb.style.display = 'block';
            breadcrumb.innerHTML = `<span onclick="location.href='diary.html'">Archives</span> > ${year}年`;
            
            const months = [...new Set(diaryPosts.filter(id => id.startsWith(year)).map(id => id.split('-')[1]))].sort((a,b) => b-a);
            let html = `<h1>${year}年の月を選択</h1><div class="archive-container">`;
            months.forEach(m => {
                html += `<a href="?year=${year}&month=${m}" class="archive-card"><h2>${parseInt(m)}月</h2></a>`;
            });
            view.innerHTML = html + '</div>';
        }

        // 3. ひと月分の日記を縦並びで表示
        async function renderMonthlyStream(year, month) {
            breadcrumb.style.display = 'block';
            breadcrumb.innerHTML = `<span onclick="location.href='diary.html'">Archives</span> > <span onclick="location.href='?year=${year}'">${year}年</span> > ${parseInt(month)}月`;
            
            const posts = diaryPosts.filter(id => id.startsWith(`${year}-${month}`)).sort((a,b) => b-a);
            
            view.innerHTML = `<h1>${year}年${parseInt(month)}月の日記</h1><div id="posts-stream" class="monthly-posts-container">読み込み中...</div>`;
            const stream = document.getElementById('posts-stream');
            let allHtml = '';

            for (const id of posts) {
                try {
                    const res = await fetch(`posts/${id}.md`);
                    const md = await res.text();
                    const htmlContent = marked.parse(md);
                    const [y, m, d] = id.split('-');
                    
                    allHtml += `
                        <section class="diary-post">
                            <div class="diary-post-date">${y}/${m}/${d}</div>
                            <div class="card">${htmlContent}</div>
                        </section>
                    `;
                } catch (e) {
                    console.error(`${id} の読み込みに失敗しました`);
                }
            }
            
            stream.innerHTML = allHtml;
            // 全て読み込み終わってからMathJaxを適用
            if (window.MathJax) MathJax.typesetPromise([stream]);
        }

        init();
    </script>
</body>
</html>
